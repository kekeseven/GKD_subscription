name: Sync upstream main

on:
  # 每天北京时间 05:27 检查已发布规则；由仓库变量控制定时同步。
  schedule:
    - cron: '27 5 * * *'
      timezone: Asia/Shanghai

  # 支持手动同步，用于首次发布及故障恢复。
  workflow_dispatch:

# 只更新当前仓库的发布文件，不需要工作流写入权限或长期令牌。
permissions:
  contents: write

# 同步任务串行执行，避免手动运行与定时运行同时推送。
concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    # 仅在 Fork 中执行；手动运行始终允许，定时运行需显式开启。
    if: >-
      ${{
        github.event.repository.fork &&
        (
          github.event_name == 'workflow_dispatch' ||
          vars.SYNC_UPSTREAM == 'true'
        )
      }}

    # 沿用 GitHub 托管环境，并限制单次任务最长运行时间。
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 只读取该上游仓库的已发布 dist 文件，不执行上游脚本。
      UPSTREAM_REPO: Lin-arm/GKD_subscription
      # 当前仓库的生产分支，同时作为上游发布文件的来源分支。
      TARGET_BRANCH: main

    steps:
      # 检出自己的生产分支；后续提交只以当前分支为父提交。
      - name: Checkout downstream main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      # 使用 Actions 机器人身份记录订阅文件同步。
      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # 复制发布快照，不合并上游提交，避免引入工作流修改及额外权限。
      - name: Sync published subscription
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 \
            "https://github.com/${UPSTREAM_REPO}.git" "${TARGET_BRANCH}"

          # 固定本次同步的上游提交，供文件提取及后续溯源使用。
          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"
          git restore --source="${UPSTREAM_SHA}" --staged --worktree -- dist

          # 必须同时保留主订阅和版本文件，缺失时直接失败并阻止发布。
          test -s dist/gkd.json5
          test -s dist/gkd.version.json5

          # 上游只有源码或工作流变化时，不重复提交或触发 Pages 部署。
          if git diff --cached --quiet -- dist; then
            echo '已发布订阅没有变化，无需更新。'
            exit 0
          fi

          git commit -m 'chore: 同步上游订阅发布文件' \
            -m "Upstream: ${UPSTREAM_REPO}@${UPSTREAM_SHA}"

          # 普通推送不会覆盖并发产生的新提交；失败后可由下次任务重试。
          git push origin "HEAD:${TARGET_BRANCH}"
          echo '订阅发布文件已同步，等待 Cloudflare Pages 自动部署。'
